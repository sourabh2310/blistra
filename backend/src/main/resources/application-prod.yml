server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    deserialization:
      use-big-decimal-for-floats: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 8000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000

blistra:
  mail:
    # Set MAIL_ENABLED=true with MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM to
    # send verification codes by email (SMTP, e.g. Brevo).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@example.com}
    app-name: ${MAIL_APP_NAME:Blistra}
  sms:
    enabled: ${SMS_ENABLED:false}
  documents:
    storage-root: ${DOCUMENTS_STORAGE_ROOT}
    max-file-size: ${DOCUMENTS_MAX_FILE_SIZE:10MB}
  otp:
    outbox-enabled: true
    delivery-key: ${BLISTRA_OTP_DELIVERY_KEY:}
    # Production: dev senders and the dev OTP endpoint are disabled.
    # REQUIRED: BLISTRA_OTP_PEPPER (code-hash pepper) and real
    # EmailSender/SmsSender provider beans (SMTP/SMS gateway).
    dev-mode: ${BLISTRA_OTP_DEV_MODE:false}
    ttl-minutes: ${BLISTRA_OTP_TTL_MINUTES:10}
    max-attempts: ${BLISTRA_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${BLISTRA_OTP_RESEND_COOLDOWN:60}
    max-per-hour: ${BLISTRA_OTP_MAX_PER_HOUR:10}
    pepper: ${BLISTRA_OTP_PEPPER:}

logging:
  level:
    root: WARN
    com.blistra: INFO
