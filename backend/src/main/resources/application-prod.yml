spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

blistra:
  documents:
    storage-root: ${DOCUMENTS_STORAGE_ROOT}
    max-file-size: ${DOCUMENTS_MAX_FILE_SIZE:10MB}

logging:
  level:
    root: WARN
    com.blistra: INFO