spring.application.name=blistra-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Authoritative user timezone (IANA) for all "today"/date-boundary semantics.
# Single canonical source, injected via UserTime; never use the server-local
# zone or a stored numeric offset. A per-user timezone (users.timezone) will
# replace this global default once a user profile exists.
blistra.user-timezone=${BLISTRA_USER_TIMEZONE:${PLANNER_USER_TIMEZONE:Asia/Kolkata}}
# Legacy alias kept for backward compatibility; blistra.user-timezone wins.
planner.user-timezone=${PLANNER_USER_TIMEZONE:Asia/Kolkata}

# Multipart file upload limits (must match or exceed document max-file-size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Documents configuration (development defaults)
blistra.documents.storage-root=${DOCUMENTS_STORAGE_ROOT:${java.io.tmpdir}/blistra-documents}
blistra.documents.max-file-size=10MB

# Actuator: expose only the health endpoint. All other actuator endpoints are
# disabled at the management layer in addition to requiring authentication at
# the security layer.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never