spring.application.name=blistra-backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
blistra.ai.enabled=${BLISTRA_AI_ENABLED:false}
blistra.ai.api-key=${FREELLM_API_KEY:}
blistra.ai.base-url=${FREELLM_BASE_URL:http://127.0.0.1:31415/v1}
blistra.ai.model=${FREELLM_MODEL:auto}
blistra.ai.max-tokens=${FREELLM_MAX_TOKENS:2048}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.task.scheduling.pool.size=4
server.forward-headers-strategy=none
blistra.security.trusted-proxies=${BLISTRA_TRUSTED_PROXIES:}
blistra.security.rate-limit.global-maximum=${BLISTRA_AUTH_GLOBAL_MAXIMUM:1000}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Authoritative user timezone (IANA) for all "today"/date-boundary semantics.
# Single canonical source, injected via UserTime; never use the server-local
# zone or a stored numeric offset. An authenticated profile timezone overrides
# this fallback for requests; anonymous/background work uses this default.
blistra.user-timezone=${BLISTRA_USER_TIMEZONE:${PLANNER_USER_TIMEZONE:Asia/Kolkata}}
# Legacy alias kept for backward compatibility; blistra.user-timezone wins.
planner.user-timezone=${PLANNER_USER_TIMEZONE:Asia/Kolkata}

# Multipart file upload limits (must match or exceed document max-file-size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Documents configuration (development defaults)
blistra.documents.backend=${DOCUMENTS_STORAGE_BACKEND:filesystem}
blistra.documents.storage-root=${DOCUMENTS_STORAGE_ROOT:${java.io.tmpdir}/blistra-documents}
blistra.documents.max-file-size=10MB

# Actuator: expose only the health endpoint. All other actuator endpoints are
# disabled at the management layer in addition to requiring authentication at
# the security layer.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace,documentStorage
# Gzip JSON responses (dashboard/list payloads) for faster loads on mobile data.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1KB

# In-app update check (GET /api/v1/app/latest): newest "apk-<build>" GitHub
# release. Raise APP_MIN_SUPPORTED_BUILD to force older installs to update.
blistra.app-update.github-repo=${APP_UPDATE_GITHUB_REPO:sourabh2310/blistra}
blistra.app-update.github-token=${APP_UPDATE_GITHUB_TOKEN:}
blistra.app-update.min-supported-build=${APP_MIN_SUPPORTED_BUILD:0}
blistra.app-update.cache-ttl=10m
