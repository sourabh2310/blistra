spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blistra}
    username: ${DB_USERNAME:blistra}
    password: ${DB_PASSWORD:blistra}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Kolkata
    deserialization:
      use-big-decimal-for-floats: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

blistra:
  documents:
    storage-root: ${DOCUMENTS_STORAGE_ROOT:${java.io.tmpdir}/blistra-documents}
    max-file-size: 10MB

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.blistra: DEBUG
    org.springframework.security: DEBUG