# Testcontainers configuration for Windows Docker Desktop
# Configure Docker client to connect via named pipe (npipe) which is the standard on Windows

# Use Docker Desktop's named pipe endpoint (most common on modern Windows Docker Desktop)
docker.client.strategy=NpipeSocketClientProviderStrategy

# Disable docker-machine strategy (not applicable on Windows Docker Desktop)
docker.client.strategy.skip.docker.machine=true

# Disable Ryuk container cleanup (can cause issues with named pipes on Windows)
ryuk.disabled=true

# Increase timeout for Docker operations on Windows
docker.client.config.timeout=60000

# Disable TLS verification (not needed for named pipe connections)
docker.client.config.use.ssl=false
