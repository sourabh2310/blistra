version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blistra-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:blistra}
      POSTGRES_USER: ${DB_USERNAME:blistra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:blistra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:blistra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
