<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blistra · Rich dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0e13;font-family:Inter,sans-serif;padding:40px 20px 80px;color:#e9eeee}
h1.pg{font:600 32px Fraunces,serif;text-align:center}
h1.pg em{color:#12B886;font-style:normal}
p.pg{text-align:center;color:#8b979a;margin:8px auto 36px;max-width:560px;font-size:14px;line-height:1.5}
.wrap{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.lab{font:600 12px Inter;letter-spacing:.1em;color:#7c888b;text-transform:uppercase}
.phone{width:390px;border-radius:44px;border:8px solid #1b2128;overflow:hidden;position:relative;box-shadow:0 30px 80px -20px #000a}
.pad{padding:50px 18px 110px;position:relative}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#000;border-radius:14px;z-index:9}

/* theme tokens */
.dark{--bg:#06090F;--tx:#EEF2F0;--mu:#8d9a98;--card:#ffffff0a;--bd:#ffffff12;--ac:#12B886;--acs:#12B88622;--track:#ffffff14;--red:#ff6b6b;--reds:#ff6b6b1c;--amb:#ffb454;--blu:#7aa2ff;--cy:#38d0e8;--pk:#f08bd0;--navbg:#0d131bdd;--onac:#04201a;--glow:1}
.light{--bg:#F5F2EA;--tx:#1b1f1c;--mu:#6f7870;--card:#ffffff;--bd:#1b1f1c14;--ac:#0e9e72;--acs:#0e9e7218;--track:#1b1f1c12;--red:#d9452f;--reds:#d9452f16;--amb:#cf7d0e;--blu:#3f66e0;--cy:#0f9db8;--pk:#c0489a;--navbg:#ffffffee;--onac:#fff;--glow:0}
.ph{background:var(--bg);color:var(--tx)}
.ph:before{content:"";position:absolute;inset:0 0 auto 0;height:420px;background:radial-gradient(420px 300px at 90% -5%,#12B88640,transparent 70%);opacity:var(--glow);pointer-events:none}
.ph>.pad>*:not(.nav){position:relative}
.row{display:flex;align-items:center;justify-content:space-between}
.eye{font:600 10px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
h2.hi{font:600 30px/1.1 Fraunces;margin:6px 0 4px;letter-spacing:-.01em}
h2.hi em{font-style:normal;color:var(--ac)}
.sub{color:var(--mu);font-size:12px;line-height:1.45}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.sec b{font:600 17px Fraunces}
.sec a{font-size:11px;color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:15px;margin-bottom:10px}
.light .card{box-shadow:0 10px 26px -16px #1b1f1c40}
.dark .card{backdrop-filter:blur(14px)}
.k{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.v{font:600 24px Fraunces;margin-top:4px;letter-spacing:-.01em}
.v small{font:500 12px Inter;color:var(--mu)}
.bar{height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:9px}.bar b{display:block;height:100%;border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .card{margin:0}
.delta{font:500 11px 'JetBrains Mono';margin-top:6px;display:block}
.up{color:var(--ac)}.dn{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em}
.urgent{background:var(--reds);border:1px solid var(--red);border-radius:22px;padding:14px;margin:16px 0 10px;display:flex;gap:12px;align-items:center;position:relative}
.urgent .ic{width:40px;height:40px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.urgent b{font-size:14px}.urgent .btn{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;padding:8px 14px;font-size:11px;font-weight:700;flex:none}
.ai{background:linear-gradient(135deg,var(--acs),transparent);border:1px solid var(--bd);border-radius:22px;padding:14px;display:flex;gap:12px;margin-bottom:10px}
.ai .spark{width:34px;height:34px;border-radius:12px;background:var(--ac);color:var(--onac);display:grid;place-items:center;flex:none;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:11px 6px;text-align:center}
.stat b{display:block;font:600 18px Fraunces}.stat span{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0;padding-top:2px}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:15px;flex:none}
.item .t{font-size:13.5px;font-weight:600}.item .s{font-size:11px;color:var(--mu);margin-top:2px}
.item .r{margin-left:auto;text-align:right;font:500 11px 'JetBrains Mono';color:var(--mu);flex:none}
.chk{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--ac);flex:none;display:grid;place-items:center;font-size:11px;color:var(--onac)}
.chk.d{background:var(--ac)}
.p-hi{background:var(--reds);color:var(--red)}.p-md{background:#ffb45422;color:var(--amb)}.p-lo{background:var(--acs);color:var(--ac)}
.week{display:flex;gap:7px;align-items:flex-end;height:96px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.week i{display:block;width:100%;border-radius:8px;background:var(--track)}
.week .on i{background:var(--ac)}
.week span{font-size:10px;color:var(--mu);font-weight:600}
.week .on span{color:var(--tx)}
.legend{display:flex;gap:14px;font-size:10px;color:var(--mu);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--track)}
.heat .a{background:var(--ac);opacity:.35}.heat .b{background:var(--ac);opacity:.65}.heat .c{background:var(--ac)}
.macro{display:flex;gap:10px;margin-top:12px}
.macro div{flex:1}.macro .l{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);font-weight:600}.macro .l b{color:var(--tx)}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vit div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 10px}
.vit b{display:block;font:600 19px Fraunces;margin-top:3px}.vit small{font-size:10px;color:var(--mu)}
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:66px;border-radius:26px;display:flex;justify-content:space-around;align-items:center;background:var(--navbg);border:1px solid var(--bd);backdrop-filter:blur(16px);z-index:5}
.light .nav{box-shadow:0 10px 30px -10px #1b1f1c50}
.nav i{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:17px;color:var(--mu)}
.nav i.on{background:var(--acs);color:var(--ac)}
.nav i.pl{width:48px;height:48px;border-radius:50%;background:var(--ac);color:var(--onac);font-size:24px;font-weight:300}
</style>
</head>
<body>
<h1 class="pg">Blistra <em>dashboard</em> — full version</h1>
<p class="pg">Urgent alerts, today's score, medicine and habit schedule, upcoming tasks, weekly statistics, nutrition, vitals and finance. Dark is the evolved Midnight Glass; light is a warm-paper variant.</p>
<div class="wrap" id="wrap"></div>

<script>
const ring=(p,s,w,c,t='var(--track)')=>{const r=(s-w)/2,C=2*Math.PI*r;return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${t}" stroke-width="${w}"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 ${s/2} ${s/2})"/></svg>`};
const spark=(pts,w,h,c)=>{const mx=Math.max(...pts),mn=Math.min(...pts),sx=w/(pts.length-1);const d=pts.map((v,i)=>(i?'L':'M')+(i*sx).toFixed(1)+' '+(h-4-((v-mn)/(mx-mn||1))*(h-8)).toFixed(1)).join(' ');return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const wk=[['M',70,0],['T',55,0],['W',88,0],['T',64,0],['F',92,0],['S',40,0],['S',76,1]];
const heat=Array.from({length:56},(_,i)=>['','a','b','c','c','b'][(i*7+i%5*3)%6]);

const body=`
<div class="row"><div class="eye">Thursday · 22 Oct</div><div class="row" style="gap:8px"><span class="ico" style="width:34px;height:34px;background:var(--card);border:1px solid var(--bd)">🔔</span><span class="ico" style="width:34px;height:34px;border-radius:50%;background:var(--acs);color:var(--ac);font-size:12px;font-weight:700">SK</span></div></div>
<h2 class="hi">Good evening,<br><em>Sourabh.</em></h2>
<div class="sub">You're having a strong day. 2 things need attention before bed.</div>

<div class="urgent"><div class="ic">💊</div><div><b>Metformin is due in 25 min</b><div class="sub" style="color:var(--red);opacity:.85">500 mg · after dinner · 9:00 PM</div></div><div class="btn">Take</div></div>
<div class="urgent" style="margin-top:0;background:#ffb45418;border-color:var(--amb)"><div class="ic" style="background:var(--amb)">⏰</div><div><b>2 tasks overdue</b><div class="sub">Pay electricity bill · Renew insurance</div></div><div class="btn" style="background:var(--amb);color:#1b1100">Review</div></div>

<div class="card" style="display:flex;gap:16px;align-items:center;margin-top:16px">
 <div style="position:relative;width:96px;height:96px;flex:none">${ring(.76,96,10,'var(--ac)')}<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><b style="font:600 28px Fraunces">76</b><div class="k" style="font-size:8px">score</div></div></div></div>
 <div style="flex:1"><div class="k">Today's progress</div><div class="v" style="font-size:20px">Almost there</div>
 <div class="sub" style="margin-top:4px">Up 8 pts vs your weekly average of 68.</div>
 <div style="margin-top:8px"><span class="pill p-lo">▲ 12-day streak</span></div></div></div>

<div class="stats">
 <div class="stat"><b>3/5</b><span>Doses</span></div>
 <div class="stat"><b>4/6</b><span>Habits</span></div>
 <div class="stat"><b>5/9</b><span>Tasks</span></div>
 <div class="stat"><b>2</b><span>Events</span></div></div>

<div class="ai"><div class="spark">✦</div><div><b style="font-size:13px">Blistra insight</b><div class="sub" style="margin-top:3px">You skip your evening dose on busy days. A 8:45 PM reminder could lift adherence from 82% to ~95%.</div></div></div>

<div class="sec"><b>Medicines</b><a>Schedule ›</a></div>
<div class="card">
 <div class="row" style="margin-bottom:10px"><div><div class="k">Adherence · 7 days</div><div class="v">86%<small> · 30/35 doses</small></div></div>${spark([70,80,75,90,85,100,86],90,36,'var(--blu)')}</div>
 <div class="item"><span class="chk d">✓</span><div><div class="t">Vitamin D3 · 1000 IU</div><div class="s">Morning · taken 8:04 AM</div></div><div class="r">8:00</div></div>
 <div class="item"><span class="chk d">✓</span><div><div class="t">Metformin · 500 mg</div><div class="s">After lunch · taken 1:12 PM</div></div><div class="r">1:00</div></div>
 <div class="item"><span class="chk" style="border-color:var(--red)"></span><div><div class="t">Metformin · 500 mg</div><div class="s" style="color:var(--red)">Due in 25 min</div></div><div class="r" style="color:var(--red)">21:00</div></div>
 <div class="item"><span class="chk"></span><div><div class="t">Omega-3 · 1 capsule</div><div class="s">Bedtime</div></div><div class="r">22:30</div></div>
 <div class="item"><div class="ico p-md" style="font-size:13px">📦</div><div><div class="t">Refill soon</div><div class="s">Metformin · 6 days of stock left</div></div><span class="pill p-md r" style="font-family:Inter">Reorder</span></div></div>

<div class="sec"><b>Habits</b><a>All habits ›</a></div>
<div class="card">
 <div class="item"><div class="ico" style="background:var(--acs)">🚶</div><div><div class="t">Morning walk</div><div class="s">6:30 AM · 🔥 12 days</div></div><span class="chk d r" style="margin-left:auto">✓</span></div>
 <div class="item"><div class="ico" style="background:#7aa2ff22">📖</div><div><div class="t">Read 20 minutes</div><div class="s">8:00 PM · 🔥 5 days</div></div><span class="pill p-md" style="margin-left:auto">Now</span></div>
 <div class="item"><div class="ico" style="background:#f08bd022">🧘</div><div><div class="t">Stretch & breathe</div><div class="s">9:30 PM · 🔥 9 days</div></div><div class="r">in 1h 55m</div></div>
 <div class="item"><div class="ico" style="background:#38d0e822">📵</div><div><div class="t">No screens</div><div class="s">10:30 PM · best 21 days</div></div><div class="r">22:30</div></div>
 <div class="k" style="margin-top:10px">Last 8 weeks</div>
 <div class="heat">${heat.map(c=>`<i class="${c}"></i>`).join('')}</div></div>

<div class="sec"><b>Upcoming tasks</b><a>Planner ›</a></div>
<div class="card">
 <div class="item"><span class="chk" style="border-color:var(--red)"></span><div><div class="t">Pay electricity bill</div><div class="s" style="color:var(--red)">Overdue · due Tue</div></div><span class="pill p-hi r" style="font-family:Inter">HIGH</span></div>
 <div class="item"><span class="chk" style="border-color:var(--red)"></span><div><div class="t">Renew car insurance</div><div class="s" style="color:var(--red)">Overdue · due Wed</div></div><span class="pill p-hi r" style="font-family:Inter">HIGH</span></div>
 <div class="item"><span class="chk"></span><div><div class="t">Review monthly budget</div><div class="s">Today · Finance list</div></div><span class="pill p-md r" style="font-family:Inter">MED</span></div>
 <div class="item"><span class="chk"></span><div><div class="t">Book dentist</div><div class="s">Tomorrow · Health list</div></div><span class="pill p-lo r" style="font-family:Inter">LOW</span></div></div>
<div class="card" style="display:flex;gap:12px;align-items:center"><div class="ico" style="background:var(--acs);color:var(--ac);flex-direction:column;width:46px;height:46px;font:700 14px Fraunces;line-height:1">24<small style="font:600 8px Inter">OCT</small></div><div><div class="t" style="font-weight:600;font-size:13.5px">Dr. Mehta — General checkup</div><div class="s sub">Fri · 5:00 PM · City Clinic</div></div><span class="pill p-lo" style="margin-left:auto">in 2 days</span></div>

<div class="sec"><b>This week</b><a>Details ›</a></div>
<div class="card">
 <div class="row"><div><div class="k">Overall completion</div><div class="v">72%<small> avg</small></div></div><span class="delta up" style="margin:0">▲ 6% vs last week</span></div>
 <div class="week">${wk.map(([d,h,on])=>`<div class="${on?'on':''}"><i style="height:${h}%"></i><span>${d}</span></div>`).join('')}</div>
 <div class="legend"><span><i style="background:var(--ac)"></i>Today</span><span><i style="background:var(--track)"></i>Earlier</span></div></div>
<div class="g2">
 <div class="card"><div class="k">Tasks done</div><div class="v">23<small> / 31</small></div><div class="bar"><b style="width:74%;background:var(--ac)"></b></div><span class="delta up">▲ 4 more</span></div>
 <div class="card"><div class="k">Habit rate</div><div class="v">81%</div><div class="bar"><b style="width:81%;background:var(--blu)"></b></div><span class="delta up">▲ 3%</span></div>
 <div class="card"><div class="k">Avg sleep</div><div class="v">7h 12m</div><div class="bar"><b style="width:90%;background:var(--pk)"></b></div><span class="delta dn">▼ 18 min</span></div>
 <div class="card"><div class="k">Steps / day</div><div class="v">8,420</div><div class="bar"><b style="width:84%;background:var(--cy)"></b></div><span class="delta up">▲ 540</span></div></div>

<div class="sec"><b>Nutrition & water</b><a>Diet ›</a></div>
<div class="card">
 <div class="row"><div><div class="k">Calories</div><div class="v">1,420<small> / 2,000 kcal</small></div></div>${ring(.71,54,7,'var(--amb)')}</div>
 <div class="macro"><div><div class="l"><span>Protein</span><b>86g</b></div><div class="bar"><b style="width:72%;background:var(--red)"></b></div></div><div><div class="l"><span>Carbs</span><b>160g</b></div><div class="bar"><b style="width:64%;background:var(--amb)"></b></div></div><div><div class="l"><span>Fat</span><b>48g</b></div><div class="bar"><b style="width:55%;background:var(--blu)"></b></div></div></div>
 <div class="item" style="margin-top:14px"><div class="ico" style="background:#38d0e822">💧</div><div style="flex:1"><div class="t">Water · 1.8 / 2.5 L</div><div class="bar" style="margin-top:6px"><b style="width:72%;background:var(--cy)"></b></div></div><span class="pill p-lo">+250 ml</span></div>
 <div class="s sub" style="margin-top:4px">Next meal: Dinner · ~600 kcal planned</div></div>

<div class="sec"><b>Health</b><a>Vitals ›</a></div>
<div class="vit">
 <div><span class="k">Weight</span><b>72.4</b><small>kg · ▼0.6</small></div>
 <div><span class="k">BP</span><b>118/76</b><small>mmHg · normal</small></div>
 <div><span class="k">Glucose</span><b>96</b><small>mg/dL · fasting</small></div></div>

<div class="sec"><b>Finance</b><a>Wallet ›</a></div>
<div class="card">
 <div class="row"><div><div class="k">Total balance</div><div class="v">₹48,260</div></div>${spark([20,24,22,30,28,36,34,42,40,48],110,44,'var(--ac)')}</div>
 <div class="g2" style="margin-top:12px"><div style="background:var(--acs);border-radius:14px;padding:10px"><div class="k">Income · Oct</div><b style="font:600 17px Fraunces">₹62,000</b></div><div style="background:var(--reds);border-radius:14px;padding:10px"><div class="k">Spent · Oct</div><b style="font:600 17px Fraunces">₹21,480</b></div></div>
 <div class="k" style="margin-top:14px">Budget · 62% used</div><div class="bar"><b style="width:62%;background:var(--amb)"></b></div>
 <div class="item" style="margin-top:10px"><div class="ico" style="background:var(--reds)">🧾</div><div><div class="t">Rent</div><div class="s">Due in 3 days</div></div><div class="r">₹14,000</div></div>
 <div class="item"><div class="ico" style="background:#7aa2ff22">🤝</div><div><div class="t">Goa trip · settle with Aman</div><div class="s">Awaiting confirmation</div></div><div class="r">₹1,850</div></div></div>

<div class="nav"><i class="on">⌂</i><i>✓</i><i class="pl">+</i><i>◔</i><i>☰</i></div>`;

document.getElementById('wrap').innerHTML=['dark','light'].map(t=>`<div class="col"><div class="lab">${t==='dark'?'Midnight Glass · dark':'Warm paper · light'}</div><div class="phone ph ${t}"><div class="notch"></div><div class="pad">${body}</div></div></div>`).join('');
</script>
</body>
</html>
