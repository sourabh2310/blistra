<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blistra — Setup Complete</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #06090F;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 48px 24px;
  font-family: -apple-system, 'Inter', sans-serif;
}

.vf { font-family: Georgia, serif; }

.screen {
  width: 390px;
  min-height: 844px;
  background: #06090F;
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}

/* Large central glow — celebratory */
.glow-c {
  position: absolute;
  width: 360px; height: 360px; border-radius: 50%;
  background: radial-gradient(circle, rgba(18,184,134,0.2) 0%, transparent 65%);
  top: 50%; left: 50%; transform: translate(-50%, -58%);
  pointer-events: none;
}
.glow-bl {
  position: absolute; width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(18,184,134,0.08) 0%, transparent 70%);
  bottom: 80px; left: -40px; pointer-events: none;
}
.glow-tr {
  position: absolute; width: 100px; height: 100px; border-radius: 50%;
  background: radial-gradient(circle, rgba(18,184,134,0.07) 0%, transparent 70%);
  top: 60px; right: -20px; pointer-events: none;
}

/* Body — vertically centred */
.body {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 0 32px;
  gap: 20px;
  position: relative; z-index: 1;
}

/* Module color dots */
.dots-row {
  display: flex; gap: 10px;
}
.dot {
  width: 10px; height: 10px; border-radius: 50%;
}

/* Checkmark ring */
.check-ring {
  width: 80px; height: 80px; border-radius: 50%;
  border: 2px solid #12B886;
  background: rgba(18,184,134,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  box-shadow: 0 0 32px rgba(18,184,134,0.2);
}

/* Text */
.eyebrow {
  font-size: 12px; color: #12B886;
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
}
.h1 {
  font-size: 36px; color: #EEF2F0;
  letter-spacing: -1px; line-height: 1.08; text-align: center;
}
.h1 em { color: #12B886; font-style: normal; }
.sub {
  font-size: 14px; color: #2E3D36;
  text-align: center; line-height: 1.65;
}

/* Stats row */
.stats {
  display: flex; gap: 0; width: 100%;
  background: rgba(255,255,255,0.03);
  border: 0.75px solid rgba(255,255,255,0.07);
  border-radius: 16px; overflow: hidden;
}
.stat {
  flex: 1; padding: 16px 8px; text-align: center;
  display: flex; flex-direction: column; gap: 5px;
}
.stat + .stat {
  border-left: 0.75px solid rgba(255,255,255,0.07);
}
.stat-val {
  font-size: 24px; font-weight: 700; color: #EEF2F0;
  letter-spacing: -0.5px;
}
.stat-val.teal { color: #12B886; }
.stat-lbl {
  font-size: 11px; color: #2E3D36;
  text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600;
}

/* Bottom */
.bottom {
  padding: 0 24px 48px;
  position: relative; z-index: 1;
  display: flex; flex-direction: column; gap: 12px;
}
.cta {
  background: #12B886; border-radius: 14px; padding: 17px;
  text-align: center; font-size: 16px; font-weight: 700;
  color: white; cursor: pointer; letter-spacing: 0.1px;
}
</style>
</head>
<body>
<div class="screen">
  <div class="glow-c"></div>
  <div class="glow-bl"></div>
  <div class="glow-tr"></div>

  <div class="body">
    <!-- Module colour dots -->
    <div class="dots-row">
      <div class="dot" style="background:#1FB99A"></div>
      <div class="dot" style="background:#FF5D7A"></div>
      <div class="dot" style="background:#4A8CFF"></div>
      <div class="dot" style="background:#FF9A3D"></div>
      <div class="dot" style="background:#8B6BFF"></div>
      <div class="dot" style="background:#E8B230"></div>
    </div>

    <!-- Checkmark -->
    <div class="check-ring">✓</div>

    <!-- Copy -->
    <div class="eyebrow">You're all set!</div>
    <div class="h1 vf">Blistra is <em>ready</em><br>for you.</div>
    <div class="sub">Your profile is complete.<br>All modules are unlocked.</div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val">6</div>
        <div class="stat-lbl">Modules</div>
      </div>
      <div class="stat">
        <div class="stat-val teal">∞</div>
        <div class="stat-lbl">Possibilities</div>
      </div>
      <div class="stat">
        <div class="stat-val">100%</div>
        <div class="stat-lbl">Done</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="cta">Go to Blistra →</div>
  </div>
</div>
</body>
</html>
