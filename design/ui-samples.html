<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blistra UI samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:#e9e6df;color:#10322b;min-height:100vh;padding:20px 12px 48px}
@media(prefers-color-scheme:dark){body{background:#0b0f0e;color:#e8f3ef}}
.bar{max-width:1240px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.bar h1{font-family:Fraunces,serif;font-size:22px;width:100%;text-align:center}
.bar p{font-size:13px;opacity:.7;width:100%;text-align:center;margin-top:-4px}
.seg{display:flex;gap:4px;background:rgba(127,127,127,.15);padding:4px;border-radius:99px}
.seg button{border:0;background:none;color:inherit;font:500 13px Inter;padding:8px 14px;border-radius:99px;cursor:pointer}
.seg button.on{background:#0f6b5a;color:#fff}
.stage{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}

/* themes */
.phone{--a:#2fd0b0;--pl:#1fb99a;--he:#ff5d7a;--me:#4a8cff;--di:#ff9a3d;--ha:#8b6bff;--fi:#e8b230;
 position:relative;width:390px;height:820px;border-radius:46px;overflow:hidden;border:9px solid #111;box-shadow:0 30px 70px rgba(0,0,0,.35);isolation:isolate;color:var(--tx);background:var(--bg);font-family:Inter,sans-serif}
.phone[data-t=aurora]{--bg:#060b1a;--tx:#eaf4ff;--mu:#8ea3c4;--gl:rgba(255,255,255,.07);--gb:rgba(255,255,255,.14);--ac:#2fd0b0;--ac2:#7a5cff;--hf:Sora,sans-serif;--nav:rgba(14,22,44,.55);--o1:#2fd0b0;--o2:#7a5cff;--o3:#2f6bff;--bgx:.5;--tile:22%;--sh:0 10px 30px rgba(0,0,0,.35)}
.phone[data-t=sage]{--bg:#f6f1e7;--tx:#10322b;--mu:#5d6f69;--gl:rgba(255,255,255,.55);--gb:rgba(255,255,255,.8);--ac:#0f6b5a;--ac2:#2fd0b0;--hf:Fraunces,serif;--nav:rgba(255,255,255,.62);--o1:#7fd8c0;--o2:#f6c98a;--o3:#9bc4f0;--bgx:.55;--tile:16%;--sh:0 10px 28px rgba(16,50,43,.10)}
.phone[data-t=bento]{--bg:#f3f1fb;--tx:#1b1740;--mu:#6c6892;--gl:rgba(255,255,255,.6);--gb:rgba(255,255,255,.9);--ac:#5b3df5;--ac2:#ff6fa8;--hf:Sora,sans-serif;--nav:rgba(255,255,255,.7);--o1:#b9a6ff;--o2:#ffc2dc;--o3:#a6e8ff;--bgx:.6;--tile:26%;--sh:0 10px 28px rgba(91,61,245,.12)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:var(--bgx);z-index:-1;pointer-events:none}
.o1{width:260px;height:260px;background:var(--o1);top:-60px;right:-70px}
.o2{width:300px;height:300px;background:var(--o2);top:380px;left:-120px}
.o3{width:240px;height:240px;background:var(--o3);bottom:40px;right:-90px}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:20px;background:#000;z-index:30}
.status{display:flex;justify-content:space-between;padding:12px 26px 0;font:600 13px Inter;height:46px;align-items:flex-start}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:0 16px 130px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.screen{display:none}.screen.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}

.glass{background:var(--gl);border:1px solid var(--gb);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-radius:24px;box-shadow:var(--sh)}
.head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.logo{display:flex;align-items:center;gap:8px;font:700 21px var(--hf);letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font:700 18px Sora;font-style:normal;position:relative}
.logo i:after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#7ff7dc}
.hbtns{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;position:relative;cursor:pointer;color:var(--tx)}
.ib b{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#ff4d6d;border:2px solid var(--bg)}
.av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#ffb98a,#ff7aa5);display:grid;place-items:center;font:600 14px Inter;color:#fff}
h2.big{font:600 30px/1.1 var(--hf);letter-spacing:-.02em}
.hi{font-size:14px;color:var(--mu);margin-bottom:4px}
.sub{font-size:13px;color:var(--mu);margin-top:6px;line-height:1.45}
.hero{position:relative;overflow:hidden;margin:14px 0;padding:18px;min-height:176px}
.hero svg.scene{position:absolute;right:-6px;top:0;width:62%;height:100%;opacity:.95;border-radius:0 24px 24px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.hero .tx{position:relative;max-width:58%}
.ringrow{display:flex;align-items:center;gap:14px;margin-top:14px}
.ring{position:relative;width:72px;height:72px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 16px var(--hf)}
.prog{height:8px;background:rgba(127,127,127,.2);border-radius:9px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .5s}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px}
.sec h3{font:600 17px var(--hf)}.sec a{font-size:12px;color:var(--ac);font-weight:600}
.phone[data-t=aurora] .sec a{color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s}
.tile:active{transform:scale(.97)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,color-mix(in srgb,var(--c) var(--tile),transparent),transparent 70%);pointer-events:none}
.tile .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;color:#fff;background:var(--c);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.tile h4{font:600 15px var(--hf);margin-top:12px}
.tile p{font-size:12px;color:var(--mu);margin-top:2px}
.tile .v{font:700 22px var(--hf);margin-top:8px}
.tile .chev{position:absolute;top:14px;right:12px;color:var(--mu);font-size:16px}
.dots{display:flex;gap:5px;margin-top:10px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu);opacity:.5}.dots i.f{background:var(--c);border-color:var(--c);opacity:1}
.mini{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:8px}.mini i{flex:1;border-radius:4px;background:color-mix(in srgb,var(--c) 40%,transparent)}.mini i.h{background:var(--c)}
.tl{padding:6px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--gb);cursor:pointer}
.row:last-child{border:0}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);flex:none}
.row .m{flex:1;min-width:0}.row b{font-weight:600;font-size:14px;display:block}.row small{font-size:12px;color:var(--mu)}
.row time{font-size:12px;color:var(--mu)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;font-size:14px;color:transparent;transition:.2s;flex:none}
.row.done .chk{background:var(--ac);border-color:var(--ac);color:#fff}
.row.done b{text-decoration:line-through;opacity:.55}
.attn{padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.week{display:flex;gap:6px;justify-content:space-between}
.week div{flex:1;text-align:center;padding:10px 0;border-radius:16px;font-size:11px;color:var(--mu);cursor:pointer}
.week div b{display:block;font:600 16px var(--hf);color:var(--tx);margin-top:4px}
.week div.on{background:linear-gradient(160deg,var(--ac),var(--ac2));color:#fff}.week div.on b{color:#fff}
.search{display:flex;align-items:center;gap:10px;padding:13px 16px;color:var(--mu);font-size:14px;border-radius:18px}
.bars{display:flex;align-items:flex-end;gap:7px;height:70px}.bars i{flex:1;border-radius:6px;background:color-mix(in srgb,var(--ac) 30%,transparent)}.bars i.h{background:linear-gradient(180deg,var(--ac2),var(--ac))}
.stats{display:flex;justify-content:space-between;margin-top:12px;text-align:center}.stats b{display:block;font:700 18px var(--hf)}.stats small{font-size:11px;color:var(--mu)}
.btn{border:0;border-radius:14px;padding:10px 16px;font:600 13px Inter;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer}

/* nav */
.nav{position:absolute;left:14px;right:14px;bottom:16px;height:70px;border-radius:30px;background:var(--nav);border:1px solid var(--gb);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);display:flex;align-items:center;justify-content:space-around;z-index:20;box-shadow:0 14px 34px rgba(0,0,0,.25)}
.nav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px Inter;cursor:pointer;width:62px;padding:6px 0;border-radius:18px;transition:.25s}
.nav button i{font-size:22px}
.nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.phone[data-t=aurora] .nav button.on{color:#7ff7dc}
.nav .fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;margin-top:-30px;box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 55%,transparent);justify-content:center}
.nav .fab i{font-size:28px}
.nav .fab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.sheetbg{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.3s}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:41;padding:20px 16px 18px;transform:translateY(120%);transition:transform .4s cubic-bezier(.2,.9,.3,1);background:var(--nav)}
.sheet.on{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:9px;background:var(--mu);opacity:.4;margin:-8px auto 14px}
.sheet h3{font:600 18px var(--hf);margin-bottom:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts div{text-align:center;padding:14px 4px;border-radius:18px;background:color-mix(in srgb,var(--c) 14%,transparent);font-size:12px;font-weight:600;cursor:pointer}
.acts div i{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;margin:0 auto 8px;background:var(--c);color:#fff;font-size:21px}
.toast{position:absolute;top:56px;left:50%;transform:translate(-50%,-80px);z-index:50;padding:10px 16px;font-size:13px;font-weight:600;border-radius:16px;transition:.4s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#bfe6e0"/></linearGradient>
<linearGradient id="skyn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a6e"/><stop offset="1" stop-color="#ff8f6b"/></linearGradient>
<symbol id="scene" viewBox="0 0 200 180" preserveAspectRatio="xMidYMid slice"><rect width="200" height="180" fill="url(#sky)"/><circle cx="130" cy="82" r="26" fill="#fff3c9" opacity=".95"/><path d="M0 120 L40 82 L70 110 L108 70 L150 112 L200 86 V180 H0Z" fill="#8fb9c4"/><path d="M0 140 L50 104 L92 134 L140 100 L200 130 V180 H0Z" fill="#5f9aa0"/><path d="M0 158 Q50 138 100 154 T200 148 V180 H0Z" fill="#2f7a68"/><g fill="#1d5a4c"><path d="M30 156 l9 -34 l9 34z"/><path d="M52 160 l8 -28 l8 28z"/><path d="M160 158 l9 -36 l9 36z"/></g></symbol>
<symbol id="sceneN" viewBox="0 0 200 180" preserveAspectRatio="xMidYMid slice"><rect width="200" height="180" fill="url(#skyn)"/><circle cx="130" cy="86" r="22" fill="#ffd9a0"/><g fill="#fff" opacity=".8"><circle cx="30" cy="30" r="1.4"/><circle cx="80" cy="18" r="1.2"/><circle cx="170" cy="30" r="1.6"/><circle cx="60" cy="55" r="1"/></g><path d="M0 120 L40 90 L70 112 L108 76 L150 112 L200 92 V180 H0Z" fill="#3d3a8c"/><path d="M0 146 L50 112 L92 140 L140 108 L200 136 V180 H0Z" fill="#232266"/><path d="M0 162 Q50 146 100 158 T200 152 V180 H0Z" fill="#11113d"/></symbol>
</defs></svg>

<div class="bar">
 <h1>Blistra UI samples</h1>
 <p>Working prototypes. Tap tabs, tick tasks, press the plus button, add water on Health.</p>
 <div class="seg" id="tsw"><button data-t="aurora" class="on">A · Aurora glass</button><button data-t="sage">B · Sage frost</button><button data-t="bento">C · Pastel bento</button></div>
 <div class="seg" id="msw"><button data-m="one" class="on">Single phone</button><button data-m="all">Compare all three</button></div>
</div>
<div class="stage" id="stage"></div>

<script>
var SCREENS=['home','planner','hub','health'];
var TASKS=[
 {t:'Morning meds',s:'8:00 AM · Medicines',i:'ti-pill',c:'--me',d:true},
 {t:'Breakfast',s:'8:30 AM · Protein-rich meal',i:'ti-tools-kitchen-2',c:'--di',d:true},
 {t:'Team sync',s:'10:00 AM · Google Meet',i:'ti-video',c:'--pl',d:false},
 {t:'Project report',s:'1:30 PM · High priority',i:'ti-file-text',c:'--ha',d:false},
 {t:'Gym workout',s:'6:00 PM · Chest and back',i:'ti-barbell',c:'--he',d:false}
];
function ring(p,sz){var r=sz/2-7,c=2*Math.PI*r;return '<div class="ring" style="width:'+sz+'px;height:'+sz+'px"><svg width="'+sz+'" height="'+sz+'"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient></defs><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="rgba(127,127,127,.22)" stroke-width="7"/><circle class="rg" cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p/100))+'"/></svg><span>'+p+'%</span></div>'}
function rows(){return TASKS.map(function(k,i){return '<div class="row'+(k.d?' done':'')+'" data-task="'+i+'" style="--c:var('+k.c+')"><div class="ic"><i class="ti '+k.i+'"></i></div><div class="m"><b>'+k.t+'</b><small>'+k.s+'</small></div><div class="chk"><i class="ti ti-check"></i></div></div>'}).join('')}
function pct(){var d=TASKS.filter(function(k){return k.d}).length;return Math.round(d/TASKS.length*100)}
function tile(c,ic,t,p,extra){return '<div class="tile glass" style="--c:var('+c+')"><i class="ti ti-chevron-right chev"></i><div class="ic"><i class="ti '+ic+'"></i></div><h4>'+t+'</h4><p>'+p+'</p>'+(extra||'')+'</div>'}
function head(){return '<div class="status"><span>9:41</span><span><i class="ti ti-antenna-bars-5"></i> <i class="ti ti-wifi"></i> <i class="ti ti-battery-3"></i></span></div><div class="head"><div class="logo"><i>b</i>blistra</div><div class="hbtns"><div class="ib glass"><i class="ti ti-search"></i></div><div class="ib glass"><i class="ti ti-bell"></i><b></b></div><div class="av">SP</div></div></div>'}
function home(th){var n=th==='aurora'?'sceneN':'scene';return head()+
 '<p class="hi">Good morning,</p><h2 class="big">Sourabh</h2><p class="sub">Thursday, 15 October · 5 things on today</p>'+
 '<div class="hero glass"><svg class="scene"><use href="#'+n+'"/></svg><div class="tx"><b style="font:600 15px var(--hf)">Your day at a glance</b><div class="ringrow"><span data-ring>'+ring(pct(),72)+'</span><div><b data-pct style="font:700 15px var(--hf)">'+TASKS.filter(function(k){return k.d}).length+' of '+TASKS.length+' done</b><div class="sub" style="margin:2px 0 0">Small steps, big changes.</div></div></div></div></div>'+
 '<div class="grid2">'+
 tile('--he','ti-heart-filled','Health','All good today','<div class="v">7,432 <small style="font:500 12px Inter;color:var(--mu)">steps</small></div>')+
 tile('--me','ti-pill','Medicines','1 dose left','<div class="prog"><i style="width:66%;background:var(--me)"></i></div><p style="margin-top:6px">Next: Vitamin D · 7 PM</p>')+
 tile('--di','ti-tools-kitchen-2','Diet','1,560 / 2,000 kcal','<div class="prog"><i style="width:78%;background:var(--di)"></i></div>')+
 tile('--ha','ti-target-arrow','Habits','3 of 5 completed','<div class="dots" style="--c:var(--ha)"><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i></div>')+
 '</div>'+
 '<div class="sec"><h3>Today\'s timeline</h3><a>View all</a></div><div class="glass tl" id="tl">'+rows()+'</div>'+
 '<div class="sec"><h3>Needs your attention</h3></div>'+
 '<div class="glass attn" style="--c:var(--he)"><span class="pill"><i class="ti ti-alert-circle"></i>Overdue</span><div class="m" style="flex:1"><b style="font-size:14px">Send proposal</b></div><i class="ti ti-chevron-right"></i></div>'+
 '<div class="glass attn" style="--c:var(--me)"><span class="pill"><i class="ti ti-clock"></i>2 hrs</span><div class="m" style="flex:1"><b style="font-size:14px">Metformin due</b></div><i class="ti ti-chevron-right"></i></div>'+
 '<div class="sec"><h3>This week</h3><a>Details</a></div><div class="glass" style="padding:16px"><div class="bars"><i style="height:35%"></i><i style="height:30%"></i><i style="height:48%"></i><i style="height:44%"></i><i class="h" style="height:92%"></i><i style="height:36%"></i><i style="height:55%"></i></div><div class="stats"><div><b>82%</b><small>Habits</small></div><div><b>91%</b><small>Tasks</small></div><div><b>6/7</b><small>Days active</small></div></div></div>'}
function planner(){return head()+'<h2 class="big">Planner</h2><p class="sub">October 2026</p><div class="glass" style="padding:8px;margin:14px 0"><div class="week">'+['M','T','W','T','F','S','S'].map(function(d,i){return '<div class="'+(i===3?'on':'')+'">'+d+'<b>'+(12+i)+'</b></div>'}).join('')+'</div></div><div class="sec"><h3>Today</h3><a>+ New task</a></div><div class="glass tl">'+rows()+'</div>'}
function hub(){return head()+'<h2 class="big">Hub</h2><p class="sub">All parts of your life, in one place.</p><div class="glass search" style="margin:14px 0"><i class="ti ti-search"></i>Search tasks, meds, notes…</div><div class="sec"><h3>Your modules</h3><a>Customize</a></div><div class="grid2">'+
 tile('--pl','ti-calendar-check','Planner','Tasks, events, schedule')+tile('--he','ti-heart','Health','Measurements and sleep')+tile('--me','ti-pill','Medicines','Doses and refills')+tile('--di','ti-tools-kitchen-2','Diet','Meals and nutrition')+tile('--ha','ti-barbell','Habits','Build better routines')+tile('--fi','ti-wallet','Finance','Spending and budgets')+'</div>'+
 '<div class="glass attn" style="margin-top:14px"><i class="ti ti-sparkles" style="font-size:26px;color:var(--ac)"></i><div style="flex:1"><b style="font-size:14px">Everything connected</b><small style="display:block;color:var(--mu);font-size:12px">Your data works together for a clearer picture.</small></div><i class="ti ti-chevron-right"></i></div>'+
 '<div class="sec"><h3>Recent activity</h3><a>See all</a></div><div class="glass tl">'+
 [['ti-tools-kitchen-2','--di','Logged lunch','520 kcal · 2h ago'],['ti-run','--ha','Morning workout','30 min · 5h ago'],['ti-pill','--me','Took Vitamin D','1 tablet · 8h ago'],['ti-wallet','--fi','Logged an expense','₹120 · Yesterday']].map(function(r){return '<div class="row" style="--c:var('+r[1]+')"><div class="ic"><i class="ti '+r[0]+'"></i></div><div class="m"><b>'+r[2]+'</b><small>'+r[3]+'</small></div><i class="ti ti-chevron-right" style="color:var(--mu)"></i></div>'}).join('')+'</div>'}
var water=5;
function health(){return head()+'<h2 class="big">Health</h2><p class="sub">Latest readings, 2 days ago</p><div class="glass" style="padding:16px;margin:14px 0;display:flex;gap:16px;align-items:center"><span>'+ring(74,92)+'</span><div><b style="font:700 26px var(--hf)">68.4 kg</b><div class="sub" style="margin:2px 0 8px">Goal 66 kg · down 0.6</div><span class="pill" style="--c:var(--pl)"><i class="ti ti-trending-down"></i>On track</span></div></div>'+
 '<div class="grid2">'+tile('--he','ti-heartbeat','Heart rate','72 bpm','<svg viewBox="0 0 100 30" style="width:100%;margin-top:8px"><polyline fill="none" stroke="var(--he)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="0,20 12,18 22,24 34,8 46,16 58,12 70,22 84,6 100,14"/></svg>')+
 tile('--ha','ti-moon-stars','Sleep','7h 20m','<div class="mini" style="--c:var(--ha)"><i style="height:50%"></i><i style="height:80%" class="h"></i><i style="height:65%"></i><i style="height:90%" class="h"></i><i style="height:60%"></i><i style="height:75%"></i></div>')+
 tile('--pl','ti-walk','Steps','7,432','<div class="prog"><i style="width:74%;background:var(--pl)"></i></div><p style="margin-top:6px">Goal 10,000</p>')+
 '<div class="tile glass" style="--c:var(--me)" data-water><div class="ic"><i class="ti ti-droplet"></i></div><h4>Water</h4><p><span data-w>'+water+'</span> of 8 glasses</p><button class="btn" style="margin-top:10px;width:100%" data-addw>+ Add glass</button></div></div>'+
 '<div class="sec"><h3>Upcoming</h3></div><div class="glass tl"><div class="row" style="--c:var(--pl)"><div class="ic"><i class="ti ti-stethoscope"></i></div><div class="m"><b>Dr. Mehta · Check-up</b><small>Mon 19 Oct · 11:30 AM</small></div><i class="ti ti-chevron-right" style="color:var(--mu)"></i></div></div>'}
function sheet(){return '<div class="sheetbg"></div><div class="sheet glass"><div class="grip"></div><h3>Quick add</h3><div class="acts">'+
 [['--pl','ti-checkbox','Task'],['--ha','ti-calendar-event','Event'],['--me','ti-pill','Medicine'],['--di','ti-tools-kitchen-2','Meal'],['--he','ti-heart-plus','Measure'],['--fi','ti-wallet','Expense']].map(function(a){return '<div style="--c:var('+a[0]+')"><i class="ti '+a[1]+'"></i>'+a[2]+'</div>'}).join('')+'</div></div><div class="toast glass"></div>'}
function nav(){var it=[['home','ti-home-2','Home'],['planner','ti-calendar','Planner'],['fab','ti-plus',''],['hub','ti-layout-grid','Hub'],['health','ti-heart','Health']];
 return '<div class="nav">'+it.map(function(x){return '<button data-go="'+x[0]+'" class="'+(x[0]==='fab'?'fab':(x[0]==='home'?'on':''))+'"><i class="ti '+x[1]+'"></i>'+x[2]+'</button>'}).join('')+'</div>'}
function phone(th){return '<div class="phone" data-t="'+th+'"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="notch"></div><div class="scroll"><div class="screen on" data-s="home">'+home(th)+'</div><div class="screen" data-s="planner">'+planner()+'</div><div class="screen" data-s="hub">'+hub()+'</div><div class="screen" data-s="health">'+health()+'</div></div>'+nav()+sheet()+'</div>'}
var theme='aurora',mode='one',stage=document.getElementById('stage');
function render(){stage.innerHTML=mode==='one'?phone(theme):['aurora','sage','bento'].map(phone).join('')}
function toast(p,m){var t=p.querySelector('.toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1600)}
function refresh(p){p.querySelectorAll('.tl').forEach(function(tl){tl.querySelectorAll('[data-task]').forEach(function(r){r.classList.toggle('done',TASKS[r.dataset.task].d)})});
 var d=TASKS.filter(function(k){return k.d}).length;var pc=pct();p.querySelectorAll('[data-pct]').forEach(function(e){e.textContent=d+' of '+TASKS.length+' done'});p.querySelectorAll('[data-ring]').forEach(function(e){e.innerHTML=ring(pc,72)})}
document.addEventListener('click',function(e){
 var p=e.target.closest('.phone');
 var tb=e.target.closest('#tsw button');if(tb){theme=tb.dataset.t;document.querySelectorAll('#tsw button').forEach(function(b){b.classList.toggle('on',b===tb)});mode='one';document.querySelectorAll('#msw button').forEach(function(b){b.classList.toggle('on',b.dataset.m==='one')});render();return}
 var mb=e.target.closest('#msw button');if(mb){mode=mb.dataset.m;document.querySelectorAll('#msw button').forEach(function(b){b.classList.toggle('on',b===mb)});render();return}
 if(!p)return;
 var g=e.target.closest('[data-go]');
 if(g){var go=g.dataset.go;if(go==='fab'){p.querySelector('.sheet').classList.add('on');p.querySelector('.sheetbg').classList.add('on');return}
  p.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on',s.dataset.s===go)});p.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b===g)});p.querySelector('.scroll').scrollTop=0;return}
 if(e.target.closest('.sheetbg')){p.querySelector('.sheet').classList.remove('on');p.querySelector('.sheetbg').classList.remove('on');return}
 var a=e.target.closest('.acts div');if(a){p.querySelector('.sheet').classList.remove('on');p.querySelector('.sheetbg').classList.remove('on');toast(p,a.textContent.trim()+' added (demo)');return}
 var r=e.target.closest('[data-task]');if(r){var k=TASKS[r.dataset.task];k.d=!k.d;document.querySelectorAll('.phone').forEach(refresh);return}
 if(e.target.closest('[data-addw]')){water=Math.min(8,water+1);document.querySelectorAll('[data-w]').forEach(function(w){w.textContent=water});toast(p,'Water logged: '+water+' of 8');return}
});
render();
</script>
