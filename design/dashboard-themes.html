<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blistra · Colour themes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070b;font-family:Inter,sans-serif;color:#e9eeee;padding:40px 20px 100px}
h1.pg{font:600 34px Fraunces,serif;text-align:center}h1.pg em{color:#2dd4a7;font-style:normal}
p.pg{text-align:center;color:#8b979a;margin:8px auto 22px;max-width:660px;font-size:14px;line-height:1.55}
.jump{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:0 auto 54px}
.jump a{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;background:#ffffff0d;border:1px solid #ffffff14;color:#cfd8d9;font-size:12px;font-weight:600;text-decoration:none}
.jump i{width:16px;height:16px;border-radius:50%;display:block}
.tsec{max-width:960px;margin:0 auto 90px}
.thead{display:flex;align-items:center;gap:14px;margin-bottom:26px;justify-content:center}
.thead .sw{display:flex}.thead .sw i{width:26px;height:26px;border-radius:50%;margin-left:-8px;border:2px solid #05070b}
.thead .sw i:first-child{margin-left:0}
.thead h2{font:600 26px Fraunces}.thead span{font-size:13px;color:#7d898b}
.pair{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
.cc{display:flex;flex-direction:column;align-items:center;gap:12px}
.mlab{font:700 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#7d898b}
.sx{position:absolute;inset:0;z-index:2;overflow-y:auto;scrollbar-width:none;padding:56px 18px 40px}
.sx::-webkit-scrollbar{display:none}
.seg{display:flex;padding:4px;border-radius:16px;margin:12px 0 22px}
.seg div{flex:1;text-align:center;padding:10px 0;border-radius:12px;font-size:12px;font-weight:700;color:var(--mu)}
.seg .on{background:var(--ac);color:var(--onac)}
.swg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.swi{border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;position:relative}
.swi .dot2{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.swi small{display:block;font-weight:400;font-size:10.5px;color:var(--mu);margin-top:2px}
.swi.sel{border-color:var(--ac)!important;box-shadow:0 0 0 1px var(--ac)}
.swi.sel:after{content:"✓";position:absolute;top:8px;right:11px;color:var(--ac);font-size:12px;font-weight:700}

/* ---------- phone + backdrop that the glass blurs ---------- */
.phone{
 width:382px;height:780px;border-radius:46px;border:8px solid #1a2027;overflow:hidden;position:relative;background:var(--bg);transition:background .3s;color:var(--tx);box-shadow:0 30px 80px -20px #000c}
.bg{position:absolute;inset:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(46px)}
.bg i:nth-child(1){width:260px;height:260px;left:-70px;top:30px;background:var(--b1)}
.bg i:nth-child(2){width:240px;height:240px;right:-80px;top:240px;background:var(--b2)}
.bg i:nth-child(3){width:260px;height:260px;left:10px;top:520px;background:var(--b3)}
.bg i:nth-child(4){width:200px;height:200px;right:-40px;bottom:-20px;background:var(--b4)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#000;border-radius:14px;z-index:20}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:52px 18px 130px;z-index:2}
.scroll::-webkit-scrollbar{display:none}

/* ---------- glass system ---------- */
.glass{background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--gb);backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);box-shadow:inset 0 1px 0 var(--gh),0 10px 24px -14px var(--shc)}
.row{display:flex;align-items:center;justify-content:space-between}
.eye{font:600 10px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
h2.hi{font:600 31px/1.1 Fraunces;margin:6px 0 4px;letter-spacing:-.01em;text-shadow:var(--ts)}h2.hi em{font-style:normal;color:var(--ac)}
.sub{color:var(--mu);font-size:12.5px;line-height:1.45}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
.sec b{font:600 17px Fraunces}.sec a{font-size:11px;color:var(--ac);font-weight:700}
.card{border-radius:24px;padding:15px}
.k{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.btn{display:inline-block;border-radius:99px;padding:10px 18px;font-size:12px;font-weight:700}
.btn.p{background:var(--hbtn);color:var(--hbtx)}.btn.g{background:color-mix(in srgb,var(--w) 16%,transparent);color:var(--hx);border:1px solid color-mix(in srgb,var(--w) 20%,transparent)}
.avatar{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--tx)}
.avatar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.streak{display:flex;align-items:center;gap:12px;border-radius:22px;padding:11px 14px;margin-top:14px}
.streak .fl{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,170,70,.32),rgba(255,110,60,.14));flex:none}
.streak .fl svg{width:20px;height:20px;fill:#ffb454;stroke:none;filter:drop-shadow(0 0 6px rgba(255,170,70,.6))}
.streak b{display:block;font:600 15px Fraunces}.streak span{font-size:10.5px;color:var(--mu)}
.streak .wkd{margin-left:auto;display:flex;gap:3px}
.streak .wkd i{width:6px;height:22px;border-radius:4px;background:color-mix(in srgb,var(--w) 12%,transparent)}
.streak .wkd i.a{background:#ffb454}.streak .wkd i.t{background:transparent;border:1.3px solid #ffb454}
.sk{display:flex;align-items:center;gap:5px;height:38px;padding:0 12px;border-radius:14px}
.sk svg{width:17px;height:17px;fill:#ffb454;stroke:none;filter:drop-shadow(0 0 6px rgba(255,170,70,.6))}
.sk b{font:600 15px Fraunces;color:#ffd08a}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.tc{flex:0 0 138px;scroll-snap-align:start;border-radius:22px;padding:13px 13px 12px}
.tc .top{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.tc .rg{width:34px;height:34px}
.tc .ti{width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--w) 8%,transparent);display:grid;place-items:center;font-size:15px;color:var(--mu)}
.tc .v{font:600 24px Fraunces;margin-top:8px}.tc .v small{font:500 11px Inter;color:var(--mu)}
.tc .s{font-size:10.5px;color:var(--mu);margin-top:3px}
.bellw{position:relative}.bdg{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#ff6b7d;color:#fff;font:700 10px Inter;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.appt{display:flex;align-items:center;gap:13px;border-radius:22px;padding:13px 14px;margin-top:12px}
.appt .dt{width:46px;height:50px;border-radius:14px;background:var(--acs);color:var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.appt .dt b{font:600 18px Fraunces;line-height:1}.appt .dt span{font:700 8px Inter;letter-spacing:.1em;margin-top:2px}
.appt .t{font-size:13.5px;font-weight:600;margin-top:2px}.appt .s{font-size:11px;color:var(--mu);margin-top:2px}
.appt .pl{margin-left:auto;font-size:10px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--acs);color:var(--ac);flex:none}
.ndg{border-radius:22px;margin-top:10px;overflow:hidden}
.nr{display:flex;align-items:center;gap:12px;padding:12px 14px}.nr+.nr{border-top:1px solid color-mix(in srgb,var(--w) 8%,transparent)}
.nr .ni2{width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--w) 8%,transparent);display:grid;place-items:center;font-size:15px;flex:none}
.nr .t{font-size:13px;font-weight:600}.nr .s{font-size:11px;color:var(--mu);margin-top:2px}
.nr .chip{margin-left:auto;font-size:11px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--acs);color:var(--ac);flex:none}
.hc em{font-style:normal;font-size:10px;color:var(--c3);font-weight:700;margin-left:2px}
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.mm b{display:block;font:600 17px Fraunces;margin-top:3px}
.cat{margin-top:10px}.cl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.cl b{color:var(--tx);font-weight:600}
.cb{height:6px;border-radius:6px;background:color-mix(in srgb,var(--w) 10%,transparent);margin-top:6px;overflow:hidden}.cb b{display:block;height:100%;border-radius:6px}
.next{border-radius:30px;padding:19px;margin-top:18px;background:linear-gradient(150deg,color-mix(in srgb,var(--red) 28%,transparent),color-mix(in srgb,var(--red) 7%,transparent));border:1px solid color-mix(in srgb,var(--red) 32%,transparent);backdrop-filter:blur(14px) saturate(120%);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--w) 14%,transparent),0 14px 30px -18px color-mix(in srgb,var(--red) 40%,transparent)}
.next .eye{color:var(--hx2)}.next .t{font:600 25px/1.15 Fraunces;margin:8px 0 4px}.next .sub{color:var(--hxm)}
.next .cd{font:500 12px 'JetBrains Mono';margin-top:9px;color:var(--hx)}.next .acts{display:flex;gap:8px;margin-top:14px}

.att{border-radius:24px;overflow:hidden;margin-top:12px}
.att .h{padding:11px 16px;background:color-mix(in srgb,var(--red) 20%,transparent);display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--hx2)}
.att .it{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid color-mix(in srgb,var(--w) 10%,transparent)}
.it .t{font-size:13.5px;font-weight:600}.it .s{font-size:11px;color:var(--mu);margin-top:2px}.it .go{margin-left:auto;font-size:11px;font-weight:700;color:var(--ac)}
.rd{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);flex:none}

.tl{position:relative;padding-left:62px}
.tl:before{content:"";position:absolute;left:49px;top:6px;bottom:6px;width:1.5px;background:linear-gradient(color-mix(in srgb,var(--w) 50%,transparent),color-mix(in srgb,var(--w) 5%,transparent))}
.ev{position:relative;display:flex;gap:11px;align-items:center;margin-bottom:10px;border-radius:20px;padding:11px 13px}
.ev .tm{position:absolute;left:-62px;font:500 11px 'JetBrains Mono';color:var(--mu);width:42px;text-align:right}
.ev:after{content:"";position:absolute;left:-17px;top:50%;margin-top:-4.5px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.ev.done{opacity:.55}.ev.done .t{text-decoration:line-through}
.ev .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:14px;flex:none;background:color-mix(in srgb,var(--w) 8%,transparent)}
.ev .t{font-size:13.5px;font-weight:600}.ev .s{font-size:11px;color:var(--mu);margin-top:2px}.ev .st{margin-left:auto;font-size:10px;font-weight:700;color:var(--mu)}
.ev.now{border-color:color-mix(in srgb,var(--ac) 40%,transparent);background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 18%,transparent),color-mix(in srgb,var(--ac) 5%,transparent))}
.tag{font:700 9px Inter;letter-spacing:.08em;padding:3px 8px;border-radius:99px;margin-left:auto;background:color-mix(in srgb,var(--amb) 22%,transparent);color:var(--amb)}

.hab{display:flex;gap:8px;flex-wrap:wrap}
.hc{display:flex;align-items:center;gap:8px;padding:9px 13px 9px 9px;border-radius:99px;font-size:12.5px;font-weight:600}
.hc i{width:20px;height:20px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--w) 60%,transparent);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--onac);flex:none}
.hc.d{background:var(--acs);border-color:color-mix(in srgb,var(--ac) 50%,transparent)}.hc.d i{background:var(--ac);border-color:var(--ac)}
.prog{height:6px;border-radius:6px;background:color-mix(in srgb,var(--w) 14%,transparent);margin:2px 0 12px;overflow:hidden}.prog b{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--c2));border-radius:6px}
.ql{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ql div{border-radius:20px;padding:13px 4px;text-align:center;font-size:10.5px;font-weight:700;color:var(--mu)}
.ql svg{width:22px;height:22px;display:block;margin:0 auto 7px;color:var(--tx)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:22px;padding:13px 11px}
.tile .v{font:600 21px Fraunces;margin-top:5px}.tile .v small{font:500 10px Inter;color:var(--mu)}.tile .s{font-size:10.5px;color:var(--mu);margin-top:3px}
.days{display:flex;gap:6px}
.days span{flex:1;height:30px;border-radius:11px;background:color-mix(in srgb,var(--w) 10%,transparent);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--mu)}
.days .a{background:var(--ac);color:var(--onac)}.days .t{border:1.5px solid var(--ac);color:var(--ac);background:transparent}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.wk .n{font:600 21px Fraunces}.wk .n small{font:500 11px Inter;color:var(--mu)}.wk .l{font-size:10px;color:var(--mu);margin-top:2px}
.mn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mn div{border-radius:20px;padding:12px 13px}.mn b{display:block;font:600 20px Fraunces;margin-top:3px}

/* ---------- NAVIGATION VARIANTS ---------- */
.nav{position:absolute;z-index:15;display:flex;align-items:center;color:var(--mu)}
.nav .ni{display:grid;place-items:center;position:relative}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .on{color:var(--tx)}
.nav small{font:600 10px Inter}
.fab{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 68%,#000));color:var(--onac)!important;display:grid;place-items:center;box-shadow:0 10px 26px -6px color-mix(in srgb,var(--ac) 70%,transparent),inset 0 1px 0 color-mix(in srgb,var(--w) 50%,transparent)}
.fab svg{stroke-width:2.2}

/* N3 docked full-width bar with raised centre FAB and cutout */
.n3{left:16px;right:16px;bottom:22px;height:72px;border-radius:32px;justify-content:space-around;padding:0 6px;background:linear-gradient(145deg,var(--g1n),var(--g2n))!important;box-shadow:inset 0 1px 0 var(--gh),0 20px 40px -16px var(--shc)}
.n3 .ni{width:56px;height:56px;gap:3px}
.n3 .ni.fabw{margin-top:-46px}
.n3 .fab{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 6px color-mix(in srgb,var(--bg) 55%,transparent),0 10px 22px -8px color-mix(in srgb,var(--ac) 50%,transparent),inset 0 1px 0 color-mix(in srgb,var(--w) 40%,transparent)}
.n3 .on{color:var(--ac)}.n3 .on:before{content:"";position:absolute;top:-4px;width:24px;height:3px;border-radius:3px;background:var(--ac);box-shadow:0 0 12px var(--ac)}
.n3 .ni small{font-size:9.5px}



/* ---------- THEME ENGINE: only --h (hue) changes per theme ---------- */
.th{--k:1}
.dk{--bg:hsl(var(--h) calc(34%*var(--k)) 6%);--tx:hsl(var(--h) calc(25%*var(--k)) 96%);--mu:hsl(var(--h) calc(14%*var(--k)) 80% / .66);
 --ac:hsl(var(--h) calc(72%*var(--k)) 62%);--onac:hsl(var(--h) calc(60%*var(--k)) 7%);--acs:color-mix(in srgb,var(--ac) 18%,transparent);
 --w:#fff;--track:color-mix(in srgb,#fff 13%,transparent);--red:#ff7a85;--amb:#ffc46b;
 --g1:rgba(255,255,255,.075);--g2:rgba(255,255,255,.03);--gb:rgba(255,255,255,.09);--gh:rgba(255,255,255,.10);--shc:rgba(0,0,0,.6);--g1n:rgba(255,255,255,.10);--g2n:rgba(255,255,255,.04);--ts:0 2px 20px rgba(0,0,0,.35);
 --b1:hsl(var(--h) 80% 48% / .34);--b2:hsl(calc(var(--h) + 55) 80% 58% / .30);--b3:hsl(calc(var(--h) - 45) 85% 52% / .22);--b4:hsl(calc(var(--h) + 120) 80% 62% / .15);
 --hx:#fff;--hx2:#ffd6da;--hxm:rgba(255,235,238,.8);--hbtn:#fff;--hbtx:#3a0d14}
.lt{--bg:hsl(var(--h) calc(36%*var(--k)) 95%);--tx:hsl(var(--h) calc(35%*var(--k)) 9%);--mu:hsl(var(--h) calc(14%*var(--k)) 26% / .72);
 --ac:hsl(var(--h) calc(72%*var(--k)) 34%);--onac:#fff;--acs:color-mix(in srgb,var(--ac) 13%,transparent);
 --w:hsl(var(--h) calc(40%*var(--k)) 14%);--track:color-mix(in srgb,var(--w) 11%,transparent);--red:#d3303c;--amb:#b46f06;
 --g1:rgba(255,255,255,.78);--g2:rgba(255,255,255,.46);--gb:rgba(255,255,255,.9);--gh:rgba(255,255,255,.95);--shc:hsl(var(--h) 40% 30% / .32);--g1n:rgba(255,255,255,.86);--g2n:rgba(255,255,255,.58);--ts:none;
 --b1:hsl(var(--h) 85% 62% / .55);--b2:hsl(calc(var(--h) + 55) 85% 68% / .45);--b3:hsl(calc(var(--h) - 45) 90% 66% / .40);--b4:hsl(calc(var(--h) + 120) 85% 70% / .30);
 --hx:#4a0f19;--hx2:#a3202f;--hxm:rgba(74,15,25,.72);--hbtn:#4a0f19;--hbtx:#fff}
.lt .notch{background:#000}
.lt .bdg{box-shadow:0 0 0 2px var(--bg)}
.lt .sk b{color:#9a5a00}
.lt .next{background:linear-gradient(150deg,color-mix(in srgb,var(--red) 22%,#fff),color-mix(in srgb,var(--red) 7%,#fff))}
.lt .att .h{background:color-mix(in srgb,var(--red) 14%,transparent)}

</style>
</head>
<body>
<h1 class="pg">Blistra <em>colour themes</em></h1>
<p class="pg">Ten themes, each in dark and light. The whole palette is derived from a single hue, so adding an eleventh theme is one line. Every phone scrolls and shows the complete dashboard.</p>
<div class="jump" id="jump"></div>
<div id="app"></div>
<script>
const I={
home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7.5L21 11"/><path d="M5.5 9.5V20h13V9.5"/></svg>',
plan:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>',
hub:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>',
bell:'<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>',
drop:'<svg viewBox="0 0 24 24"><path d="M12 3.5s6 6.2 6 10.5a6 6 0 0 1-12 0c0-4.300 6-10.500 6-10.500z"/></svg>',
meal:'<svg viewBox="0 0 24 24"><path d="M7 3v8M4.500 3v5a2.500 2.500 0 0 0 5 0V3M7 11v10M17 21V3c-2.500 1.500-3.500 4.500-3.500 8H17"/></svg>',
rupee:'<svg viewBox="0 0 24 24"><path d="M7 5h10M7 9.500h10M7 5c6 0 6 9 0 9h-.5l6 5.500"/></svg>',
