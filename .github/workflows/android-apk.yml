name: Verify and release

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --exclude-tags e2e
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: blistra_contract
          POSTGRES_USER: blistra_contract
          POSTGRES_PASSWORD: disposable_contract_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/blistra_contract
      DB_USERNAME: blistra_contract
      DB_PASSWORD: disposable_contract_password
      JWT_SECRET: isolated-contract-test-secret-minimum-32-bytes
      BLISTRA_E2E_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Start disposable contract backend
        shell: bash
        run: |
          set -eu
          export DOCUMENTS_STORAGE_ROOT="$RUNNER_TEMP/contract-documents"
          cd backend
          chmod +x mvnw
          ./mvnw -q -DskipTests package
          java -jar target/backend-*.jar > target/contract-backend.log 2>&1 &
          echo "CONTRACT_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness > /dev/null; then exit 0; fi
            sleep 5
          done
          tail -n 60 target/contract-backend.log
          exit 1
      - name: Create verified test accounts
        run: python3 scripts/bootstrap_contract_users.py
      - name: Exercise real Flutter clients against the API
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/e2e/contract_test.dart
      - name: Stop contract backend
        if: always()
        shell: bash
        run: if [ -n "${CONTRACT_PID:-}" ]; then kill "$CONTRACT_PID" || true; fi
  apk:
    needs: [backend, frontend, contract]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=app/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "Release signing secrets are required." >&2
            exit 1
          fi

      - run: flutter pub get --enforce-lockfile

      - name: Test
        run: flutter test --exclude-tags e2e

      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          set -eu
          test -n "$SUPPORT_EMAIL"
          python3 -c 'import os,urllib.parse; u=urllib.parse.urlparse(os.environ["API_BASE_URL"]); assert u.scheme=="https" and u.hostname and not u.username and u.path in ("", "/") and not u.query and not u.fragment, "API_BASE_URL must be an HTTPS origin"'
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number "${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL" \
            --dart-define=APP_BUILD="${{ github.run_number }}"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk blistra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blistra-apk
          path: frontend/blistra.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Blistra APK ${{ github.run_number }}
          files: frontend/blistra.apk
          generate_release_notes: true
