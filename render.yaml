# Render blueprint: free web service running the backend container.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: blistra-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false            # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BLISTRA_OTP_PEPPER
        generateValue: true
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_USERNAME
        sync: false            # Brevo SMTP login
      - key: MAIL_PASSWORD
        sync: false            # Brevo SMTP key
      - key: MAIL_FROM
        sync: false            # verified sender address
      - key: BLISTRA_CORS_ORIGIN_PATTERNS
        value: "*"             # the APK is not a browser; tighten if you host a web build
