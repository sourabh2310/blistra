# Free Render compute with upload bytes stored in the existing Neon database.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: blistra-api
    runtime: docker
    branch: main
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DOCUMENTS_STORAGE_BACKEND
        value: postgres
      - key: DOCUMENTS_MAX_TOTAL_BYTES
        value: "67108864"       # 64 MiB aggregate logical upload budget
      - key: DB_URL
        sync: false            # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BLISTRA_OTP_PEPPER
        generateValue: true
      - key: BLISTRA_OTP_DELIVERY_KEY
        sync: false            # base64-encoded 32 random bytes; preserve across restarts
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_PORT
        value: "2525"          # Brevo SMTP; free Render services block 25, 465 and 587
      - key: MAIL_USERNAME
        sync: false            # Brevo SMTP login
      - key: MAIL_PASSWORD
        sync: false            # Brevo SMTP key
      - key: MAIL_FROM
        sync: false            # verified sender address
      - key: BLISTRA_CORS_ORIGIN_PATTERNS
        sync: false            # exact browser origins; native apps do not need CORS
